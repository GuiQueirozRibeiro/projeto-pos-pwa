<!doctype html>
<html lang="pt-BR" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Ritmo — Foco e blocos de tempo</title>
    <meta
      name="description"
      content="Ritmo é um PWA para planejar o dia em blocos de horário, executar as tarefas com Pomodoro e acompanhar o que foi feito."
    />

    <!-- Cor da barra do navegador/sistema (deve combinar com o manifest) -->
    <meta name="theme-color" content="#4f46e5" />

    <!-- Ícones: favicon para o navegador, apple-touch-icon para o iOS
         (o Safari ainda não usa os ícones do manifest na tela inicial) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ritmo" />

    <!-- Fonte Inter (Google Fonts). Fica em cache pelo service worker
         (ver runtimeCaching em vite.config.js), então funciona offline
         depois do primeiro acesso. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  </head>
  <body>
    <noscript>O Ritmo precisa de JavaScript para funcionar.</noscript>
    <div id="root">
      <div id="initial-loader" style="height: 100vh; display: flex; justify-content: center; align-items: center; flex-direction: column; background-color: #0f1020; color: #fff;">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="animation: spin 1s linear infinite;">
          <line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line>
        </svg>
        <style>
          @keyframes spin { 100% { transform: rotate(360deg); } }
          @media (prefers-color-scheme: light) {
            #initial-loader { background-color: #f8fafc !important; color: #0f172a !important; }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
